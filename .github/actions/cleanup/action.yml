name: Cleanup Deployment
description: Run cleanup command to tear down a deployed quickstart

inputs:
  cleanup_command:
    description: Command to tear down the deployment
    required: true
  working_dir:
    description: Directory to run cleanup in
    required: false
    default: ./quickstart

runs:
  using: composite
  steps:
    - name: Cleanup deployment
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      continue-on-error: true
      env:
        CLEANUP_COMMAND: ${{ inputs.cleanup_command }}
      run: eval "$CLEANUP_COMMAND"

    - name: Stop OpenShift registry port-forward
      shell: bash
      continue-on-error: true
      run: |
        pid_file="$RUNNER_TEMP/ci-image-registry-port-forward.pid"
        if [ -f "$pid_file" ]; then
          kill "$(cat "$pid_file")" 2>/dev/null || true
        fi

    - name: Delete remaining resources
      shell: bash
      continue-on-error: true
      run: |
        oc delete pods,deployments,replicasets,statefulsets,services,jobs,cronjobs,daemonsets,pvc --all -n "$NAMESPACE"
        oc delete secret ci-image-registry-tls -n "$NAMESPACE" --ignore-not-found
